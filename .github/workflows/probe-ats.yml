name: Probe ATS Endpoints (one-off discovery)

# Manual only -- this is a discovery tool, not part of the daily pipeline.
on:
  workflow_dispatch:
    inputs:
      script:
        description: "Which probe script to run"
        default: "probe_ats.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install requests
      - name: Run ATS probe
        working-directory: scripts
        run: python "${{ inputs.script }}"
      - name: Commit probe results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "ATS probe results $(date -u +%Y-%m-%dT%H:%M)" || echo "Nothing to commit"
          git push
