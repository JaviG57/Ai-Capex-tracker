name: Daily AI Capex Data Pull

on:
  schedule:
    # 13:00 UTC daily (~9am ET / 6am PT) -- after prior-day markets/filings
    # settle, before the US market opens. GitHub may delay scheduled runs
    # by a few minutes during high load; that's normal.
    - cron: "0 13 * * *"
  workflow_dispatch: {} # lets you trigger a manual run from the Actions tab too

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily data pull
        working-directory: scripts
        env:
          THEIRSTACK_API_KEY: ${{ secrets.THEIRSTACK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THEIRSTACK_DEBUG_LIMIT: "2"
        run: python run_daily.py

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Daily data update $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push
